[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-memory-safe-check"
version = "1.0.0"
description = "Memory safety checker for C-like pseudocode (buffer overflow)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mahmoud ElNemer", email = "sultanelnemer@gmail.com"}]
keywords = ["python", "memory-safety", "buffer-overflow", "security", "static-analysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ElNeMeR70/py-memory-safe-check"
Repository = "https://github.com/ElNeMeR70/py-memory-safe-check"
